name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org ir.dastgahyar --project-name dastgahyar2 /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Fix Gradle version
        run: |
          WRAP="android/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip|' "$WRAP"

      - name: Set SDK version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(name)
              if not p.exists(): continue
              s = p.read_text()
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 34")
              s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 34")
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 34")
              s = s.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 34")
              p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Create simple icon
        run: |
          mkdir -p assets/icon
          python3 - <<'PY'
          from PIL import Image
          img = Image.new("RGB", (512, 512), (255, 176, 32))
          img.save("assets/icon/icon.png")
          PY

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "Icon generation skipped"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find . -path "*outputs*" -name "app-debug.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found. Searching..."
            find . -name "*.apk"
            exit 1
          fi
          cp "$APK" dist/DastgahYar-debug.apk
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DastgahYar-APK
          path: dist/*.apk
